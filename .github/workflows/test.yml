name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  docker-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - xray: latest
            sha256: ''
          - xray: v26.3.27
            sha256: 23cd9af937744d97776ee35ecad4972cf4b2109d1e0fe6be9930467608f7c8ae
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build --pull -f Dockerfile.test -t xray-oneclick-test \
            --build-arg XRAY_VERSION="${{ matrix.xray }}" \
            --build-arg XRAY_ASSET_SHA256="${{ matrix.sha256 }}" .

      - name: Run complete test suite
        run: docker run --rm xray-oneclick-test

      - name: Test fresh deployment and connection on OpenRC
        if: matrix.xray == 'latest'
        run: |
          docker build --target deployment -f Dockerfile.test -t xray-oneclick-deployment .
          docker run --rm xray-oneclick-deployment
